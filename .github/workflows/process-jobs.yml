name: Process Job Queue

on:
  schedule:
    # Run every 2 minutes to process pending background jobs
    - cron: "*/2 * * * *"
  workflow_dispatch: {}

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Delegates to scripts/ci/call-cron.sh, which resolves the canonical origin
      # before sending the secret and — more usefully — says what a failure
      # actually means. This job had been failing every 2 minutes and reporting
      # only "failed with status 401", which does not distinguish "wrong URL" from
      # "wrong secret". It is the latter: the request reaches the endpoint and is
      # rejected, so secrets.CRON_SECRET does not match the CRON_SECRET in Vercel.
      - name: Process pending jobs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: scripts/ci/call-cron.sh /api/jobs/process POST
