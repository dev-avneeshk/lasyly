name: Weekly Coins Payout
on:
  schedule:
    # 00:15 UTC every Monday — the start of a new ISO week.
    - cron: '15 0 * * 1'
  workflow_dispatch:

jobs:
  payout:
    runs-on: ubuntu-latest
    steps:
      - name: Grant weekly level-based coin bonus
        run: |
          # The route stops at a time budget and resumes from a cursor, so call
          # again while it reports incomplete (bounded).
          for attempt in $(seq 1 10); do
            response=$(curl -s --location-trusted -w "\n%{http_code}" -X POST \
              "${{ secrets.SITE_URL }}/api/cron/weekly-coins" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json")

            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')

            echo "Run $attempt status: $http_code"
            echo "Response: $body"

            if [ "$http_code" != "200" ]; then
              echo "::warning::Weekly coins payout returned status $http_code"
              break
            fi
            echo "$body" | grep -q '"incomplete":true' || break
            if [ "$attempt" = 10 ]; then echo "::warning::Weekly coins payout still incomplete after 10 calls"; fi
          done
