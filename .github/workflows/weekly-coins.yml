name: Weekly Coins Payout
on:
  schedule:
    # 00:15 UTC every Monday — the start of a new ISO week.
    - cron: '15 0 * * 1'
  workflow_dispatch:

jobs:
  payout:
    runs-on: ubuntu-latest
    steps:
      - name: Grant weekly level-based coin bonus
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SITE_URL }}/api/cron/weekly-coins" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" != "200" ]; then
            echo "::warning::Weekly coins payout returned status $http_code"
          fi
