name: Ingest Novig NBA prop lines
# Hits /api/cron/ingest-novig-lines, which stores each of today's NBA games'
# Novig main prop lines ONCE (via ParlayAPI) so the NBA props page uses the
# market line instead of the L10 average. The route holds PARLAY_API_KEY (set in
# Vercel); this workflow only needs SITE_URL + CRON_SECRET.
#
# Schedule (UTC):
#   16:00  main run     (12:00 EDT / 11:00 EST), well before the earliest regular tip
#   21:00  catch-up run (17:00 EDT / 16:00 EST), only pays if a game is still uncaptured
#
# Credit math (ParlayAPI /props = 3 credits per call/page; /events is free):
#   - main run: 1 sport-wide call per game day          ~27 days x 3 = ~81/month
#   - catch-up: pays only when a game is still missing   ~9 days x 3  = ~27/month
#   - pagination / truncated follow-ups (rare)                         ~12/month
#   expected ~120 credits/month; off-days and the off-season cost 0.
# Hard caps enforced by the route (lib/novig/ingest.ts DEFAULT_INGEST_LIMITS):
#   4 paid calls per run, 6 per slate day (<= 540 credits/month), 2 pages per
#   query, 2 per-event follow-ups, stop below 100 remaining credits.
# workflow_dispatch is enabled for manual runs; it is bounded by the same daily cap.
on:
  schedule:
    - cron: '0 16 * * *'  # main run
    - cron: '0 21 * * *'  # catch-up run
  workflow_dispatch: # allow manual trigger
concurrency:
  group: ingest-novig-lines
  cancel-in-progress: false
jobs:
  ingest:
    name: Ingest Novig prop lines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Delegates to scripts/ci/call-cron.sh, which resolves the canonical origin
      # before sending the secret and prints the remediation on failure.
      - name: Trigger Novig ingest cron
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_TIMEOUT: "300"
        run: scripts/ci/call-cron.sh /api/cron/ingest-novig-lines GET
