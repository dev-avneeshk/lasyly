name: Precompute Props (NBA + NFL)

# Turns the app's most expensive read-time compute into a scheduled write.
# Hits /api/cron/precompute-props, which runs the NBA + NFL engines for the
# default slates (stat=all, direction=all) and stores the finished results in
# the computed_props table. The /api/props endpoint then serves a single
# indexed SELECT instead of recomputing, falling back to live compute only for
# bespoke views (filters/search/matchup) or when a slate is missing/stale.
#
# Cadence: every 3 hours. Props derive from completed games + the scheduled
# slate, which only change when a scraper runs, so 3h keeps lines reasonably
# fresh (injury/rotation news moves them intraday) without hammering the DB.
# The scrapers (scrape-nfl 09:00 UTC, scrape-sports) populate the raw tables
# this reads; running on the 3h grid means a fresh slate lands shortly after
# each morning scrape.

on:
  schedule:
    - cron: '15 */3 * * *'  # every 3 hours, at :15 (after scrapers settle)
  workflow_dispatch: # allow manual trigger

jobs:
  precompute:
    name: Precompute default prop slates
    runs-on: ubuntu-latest
    steps:
      - name: Trigger precompute cron
        run: |
          # Resolve the CANONICAL origin before sending the secret.
          #
          # The apex domain 307s to the www host. Sending the request at the apex
          # with no -L got a redirect stub (the job then failed on a 307), and
          # plain -L drops the Authorization header across a cross-host redirect
          # and got a 401. Either way computed_props stayed empty and every props
          # request fell through to a full live recompute. Both were verified
          # against production.
          #
          # So: follow redirects ONCE on a harmless unauthenticated endpoint to
          # learn where SITE_URL actually lands, then post the secret directly to
          # that origin. No credential ever crosses a redirect, and this is
          # correct whether the SITE_URL secret holds the apex or the www host.
          RAW="${{ secrets.SITE_URL }}"
          FINAL=$(curl -s -o /dev/null -L --max-time 30 -w '%{url_effective}' "$RAW/api/health" || echo "")
          if [ -n "$FINAL" ]; then
            ORIGIN=$(printf '%s' "$FINAL" | sed -E 's#^(https?://[^/]+).*#\1#')
          else
            ORIGIN="$RAW"
          fi
          echo "SITE_URL resolved to origin: $ORIGIN"

          echo "Precomputing NBA + NFL default slates…"
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$ORIGIN/api/cron/precompute-props")
          BODY=$(echo "$RESPONSE" | head -n -1)
          CODE=$(echo "$RESPONSE" | tail -n 1)
          echo "Status: $CODE"
          echo "Body:   $BODY"
          if [ "$CODE" != "200" ]; then
            echo "::error::Precompute returned $CODE"
            exit 1
          fi
          echo "✓ Precompute complete"
