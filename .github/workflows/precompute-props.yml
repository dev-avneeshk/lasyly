name: Precompute Props (NBA + NFL)

# Turns the app's most expensive read-time compute into a scheduled write.
# Hits /api/cron/precompute-props, which runs the NBA + NFL engines for the
# default slates (stat=all, direction=all) and stores the finished results in
# the computed_props table. The /api/props endpoint then serves a single
# indexed SELECT instead of recomputing, falling back to live compute only for
# bespoke views (filters/search/matchup) or when a slate is missing/stale.
#
# Cadence: every 3 hours. Props derive from completed games + the scheduled
# slate, which only change when a scraper runs, so 3h keeps lines reasonably
# fresh (injury/rotation news moves them intraday) without hammering the DB.
# The scrapers (scrape-nfl 09:00 UTC, scrape-sports) populate the raw tables
# this reads; running on the 3h grid means a fresh slate lands shortly after
# each morning scrape.

on:
  schedule:
    - cron: '15 */3 * * *'  # every 3 hours, at :15 (after scrapers settle)
  workflow_dispatch: # allow manual trigger

jobs:
  precompute:
    name: Precompute default prop slates
    runs-on: ubuntu-latest
    steps:
      - name: Trigger precompute cron
        run: |
          echo "Precomputing NBA + NFL default slates…"
          # --location-trusted, not just -L: the apex domain 307s to the www
          # canonical host, and plain -L DROPS the Authorization header on a
          # cross-host redirect. Without this the job either reported 307 (no
          # -L) or 401 (plain -L) and never wrote a row — which is why
          # computed_props sat empty and every props request fell through to a
          # full live recompute. Both hosts are ours, so forwarding the cron
          # secret across the redirect is safe.
          RESPONSE=$(curl -s --location-trusted -w "\n%{http_code}" --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/precompute-props")
          BODY=$(echo "$RESPONSE" | head -n -1)
          CODE=$(echo "$RESPONSE" | tail -n 1)
          echo "Status: $CODE"
          echo "Body:   $BODY"
          if [ "$CODE" != "200" ]; then
            echo "::error::Precompute returned $CODE"
            exit 1
          fi
          echo "✓ Precompute complete"
