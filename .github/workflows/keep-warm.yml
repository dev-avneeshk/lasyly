name: Keep Warm

on:
  schedule:
    # Runs every 5 minutes — keeps Vercel serverless functions warm to avoid cold starts
    - cron: '*/5 * * * *'
  workflow_dispatch: # allow manual trigger

jobs:
  ping:
    name: Ping production
    runs-on: ubuntu-latest
    steps:
      # All URLs below use the CANONICAL www host and follow redirects.
      # They previously pointed at the apex domain without -L, so every request
      # got a 307 to www and nothing was ever warmed: the health check reported
      # a bogus non-200 and the props warm-up did no work at all, which is what
      # let the prop slate caches lapse and left real visitors paying for the
      # cold recompute.
      - name: Ping health endpoint
        run: |
          STATUS=$(curl -sL -o /dev/null -w "%{http_code}" https://www.lasyly.me/api/health)
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Health check returned $STATUS — site may be down"
          else
            echo "✓ Site is warm and healthy"
          fi

      # Pre-warm the props cache so real users never pay for a cold recompute.
      # The props endpoint's cache-aside layer keeps a stale entry for 2x the
      # per-sport TTL (NFL 10min -> 20min window, NBA 3min -> 6min window), so a
      # hit every 5 minutes keeps the default slates perpetually warm/refreshing
      # in the background instead of blocking the first visitor after expiry.
      # NFL is warmed first because it is the default sport on the Props page.
      - name: Warm props cache
        run: |
          warm() {
            local url="$1"
            local out
            out=$(curl -sL -o /dev/null -w "%{http_code} %{time_total}s" --max-time 90 "$url")
            echo "  [$out] $url"
            case "$out" in
              200*) ;;
              *) echo "::warning::warm-up did not return 200 for $url" ;;
            esac
          }
          echo "Warming props cache (default stat=all slates)…"
          # NFL — default sport, warmed first
          warm "https://www.lasyly.me/api/props?sport=NFL&stat=all&direction=all"
          warm "https://www.lasyly.me/api/props/games?sport=NFL"
          # NBA — next most common
          warm "https://www.lasyly.me/api/props?sport=NBA&stat=all&direction=all"
          warm "https://www.lasyly.me/api/props/games?sport=NBA"
          echo "✓ Props warm-up complete"
